name: Numbat Forensic Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: python -m pip install numpy

      - name: Verify tensor fingerprints
        shell: bash
        run: |
          python - <<'PY' > numbat-forensics.log 2>&1
          import json
          import hashlib
          import struct
          import urllib.request
          import numpy as np

          REPO = "burner22/numbat"
          BASE = f"https://huggingface.co/{REPO}/resolve/main"

          TARGETS = {
              "model.layers.0.input_layernorm.weight": "norm",
              "model.layers.0.self_attn.k_conv1d.weight": "conv"
          }

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Numbat-Forensics/1.0"}
              )
              with urllib.request.urlopen(req, timeout=180) as r:
                  return r.read()

          def fetch_range(url, start, end):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Range": f"bytes={start}-{end}",
                      "Accept-Encoding": "identity",
                      "User-Agent": "Numbat-Forensics/1.0"
                  }
              )

              with urllib.request.urlopen(req, timeout=180) as r:
                  if r.status != 206:
                      raise RuntimeError(
                          f"Expected HTTP 206, received {r.status}"
                      )

                  content_range = r.headers.get("Content-Range", "")
                  if not content_range.startswith(
                      f"bytes {start}-{end}/"
                  ):
                      raise RuntimeError(
                          f"Unexpected Content-Range: {content_range}"
                      )

                  data = r.read()

              if len(data) != end - start + 1:
                  raise RuntimeError("Incomplete range response")

              return data

          def to_bf16_bytes(values):
              values = np.asarray(values, dtype=np.float32)
              values = np.ascontiguousarray(values)

              bits = values.view(np.uint32)

              rounded = (
                  bits
                  + np.uint32(0x7FFF)
                  + ((bits >> 16) & np.uint32(1))
              )

              result = (rounded >> 16).astype("<u2")
              return result.tobytes()

          def generate_candidate(name, shape, kind, endian, rng_dtype):
              digest = hashlib.sha256(name.encode()).digest()
              seed = int.from_bytes(digest[:8], endian)

              rng = np.random.Generator(np.random.PCG64(seed))

              if rng_dtype == "float32":
                  z = rng.standard_normal(
                      shape, dtype=np.float32
                  )
              else:
                  z = rng.standard_normal(shape)

              if kind == "norm":
                  values = np.exp(0.06 * z)
              else:
                  values = z / 6.0

              return to_bf16_bytes(values)

          def inspect_tensor(name, kind, index):
              print("\n" + "=" * 65)
              print("TENSOR:", name)
              print("=" * 65)

              shard = index["weight_map"].get(name)

              if not shard:
                  raise RuntimeError("Tensor absent from index")

              print("Shard:", shard)

              url = f"{BASE}/{shard}"

              first = fetch_range(url, 0, 7)
              header_size = struct.unpack("<Q", first)[0]

              if header_size > 100 * 1024 * 1024:
                  raise RuntimeError("Unexpected header size")

              header_bytes = fetch_range(
                  url, 8, 7 + header_size
              )

              header = json.loads(header_bytes)

              if name not in header:
                  raise RuntimeError("Tensor absent from shard header")

              meta = header[name]
              dtype = meta["dtype"]
              shape = meta["shape"]
              offsets = meta["data_offsets"]

              print("Dtype:", dtype)
              print("Shape:", shape)

              if dtype != "BF16":
                  print("UNSUPPORTED DTYPE: expected BF16")
                  return False

              start = 8 + header_size + offsets[0]
              end = 8 + header_size + offsets[1] - 1

              actual = fetch_range(url, start, end)

              expected_size = int(np.prod(shape)) * 2

              if len(actual) != expected_size:
                  raise RuntimeError("Unexpected tensor byte count")

              print("Actual bytes:", len(actual))

              matches = []

              for endian in ("little", "big"):
                  for rng_dtype in ("float64", "float32"):
                      candidate = generate_candidate(
                          name,
                          shape,
                          kind,
                          endian,
                          rng_dtype
                      )

                      exact = candidate == actual

                      print(
                          f"Seed={endian}, RNG={rng_dtype}: "
                          f"{'EXACT MATCH' if exact else 'NO MATCH'}"
                      )

                      if exact:
                          matches.append((endian, rng_dtype))

              if matches:
                  print("RESULT: EXACT SEEDED-RNG MATCH")
                  print("Matching variants:", matches)
                  return True

              print("RESULT: NO EXACT MATCH")
              return False

          print("=" * 65)
          print("NUMBAT FORENSIC VERIFICATION")
          print("No repository Python code will be executed.")
          print("Only two selected tensor ranges will be downloaded.")
          print("=" * 65)

          print("\nDownloading tensor index...")
          index = json.loads(
              fetch(f"{BASE}/model.safetensors.index.json")
          )

          print("Index entries:", len(index["weight_map"]))

          results = {}

          for name, kind in TARGETS.items():
              results[name] = inspect_tensor(
                  name, kind, index
              )

          print("\n" + "=" * 65)
          print("FINAL FORENSIC RESULT")
          print("=" * 65)

          for name, matched in results.items():
              print(
                  ("MATCH: " if matched else "NO MATCH: ") + name
              )

          count = sum(results.values())

          print(f"\nExact matches: {count}/{len(results)}")

          if count == len(results):
              print("VERDICT: BOTH SAMPLES MATCH SEEDED RANDOM DATA")
          elif count:
              print("VERDICT: PARTIAL SEEDED-RNG EVIDENCE")
          else:
              print("VERDICT: REPORTED RECIPE NOT CONFIRMED")

          print("\nThis is a two-tensor test, not a complete")
          print("authentication of the entire checkpoint.")
          PY

          cat numbat-forensics.log

      - name: Upload forensic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numbat-forensic-report
          path: numbat-forensics.log
          retention-days: 7
