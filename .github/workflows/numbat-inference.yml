name: Numbat Full Forensic Scan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NumPy
        run: python -m pip install numpy

      - name: Scan model tensors
        shell: bash
        run: |
          python - <<'PY' > numbat-forensics.log 2>&1
          import json
          import hashlib
          import struct
          import urllib.request
          import numpy as np

          REPO = "burner22/numbat"
          BASE = f"https://huggingface.co/{REPO}/resolve/main"

          def fetch_range(url, start, end):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Range": f"bytes={start}-{end}",
                      "Accept-Encoding": "identity",
                      "User-Agent": "Numbat-Forensics/2.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=180) as r:
                  if r.status != 206:
                      raise RuntimeError(f"HTTP {r.status}")
                  cr = r.headers.get("Content-Range", "")
                  if not cr.startswith(f"bytes {start}-{end}/"):
                      raise RuntimeError(f"Bad Content-Range: {cr}")
                  data = r.read()

              if len(data) != end - start + 1:
                  raise RuntimeError("Incomplete range")
              return data

          def fetch_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Numbat-Forensics/2.0"}
              )
              with urllib.request.urlopen(req, timeout=180) as r:
                  return json.loads(r.read())

          def bf16_bytes(values):
              values = np.asarray(values, dtype=np.float32)
              bits = np.ascontiguousarray(values).view(np.uint32)
              rounded = (
                  bits + np.uint32(0x7FFF)
                  + ((bits >> 16) & np.uint32(1))
              )
              return (rounded >> 16).astype("<u2").tobytes()

          def candidate(name, shape, kind):
              seed = int.from_bytes(
                  hashlib.sha256(name.encode()).digest()[:8],
                  "big"
              )
              rng = np.random.Generator(np.random.PCG64(seed))
              z = rng.standard_normal(shape, dtype=np.float32)

              if kind == "norm":
                  values = np.exp(np.float32(0.06) * z)
              else:
                  values = z / np.float32(6.0)

              return bf16_bytes(values)

          print("=" * 70)
          print("NUMBAT FULL FORENSIC SCAN")
          print("=" * 70)

          print("\nLoading model index...")
          index = fetch_json(
              f"{BASE}/model.safetensors.index.json"
          )
          weight_map = index["weight_map"]

          selected = []

          for name in weight_map:
              if name.endswith("input_layernorm.weight"):
                  selected.append((name, "norm"))
              elif name.endswith("post_attention_layernorm.weight"):
                  selected.append((name, "norm"))
              elif name.endswith("self_attn.k_conv1d.weight"):
                  selected.append((name, "conv"))

          selected.sort()

          # Sample up to 60 evenly distributed tensors.
          limit = 60

          if len(selected) > limit:
              positions = np.linspace(
                  0, len(selected) - 1, limit, dtype=int
              )
              selected = [selected[i] for i in positions]

          print("Available candidate tensors:", len(weight_map))
          print("Selected tensors:", len(selected))

          header_cache = {}
          results = []

          for number, (name, kind) in enumerate(selected, 1):
              try:
                  shard = weight_map[name]
                  url = f"{BASE}/{shard}"

                  if shard not in header_cache:
                      first = fetch_range(url, 0, 7)
                      header_size = struct.unpack("<Q", first)[0]

                      if header_size > 100 * 1024 * 1024:
                          raise RuntimeError("Header too large")

                      header_bytes = fetch_range(
                          url, 8, 7 + header_size
                      )
                      header_cache[shard] = json.loads(header_bytes)

                  header = header_cache[shard]
                  meta = header[name]

                  if meta["dtype"] != "BF16":
                      print(f"[SKIP] {name}: {meta['dtype']}")
                      continue

                  shape = meta["shape"]
                  offsets = meta["data_offsets"]

                  start = 8 + header_size if False else None
                  # Header size is encoded in the first 8 bytes.
                  header_size = struct.unpack(
                      "<Q", fetch_range(url, 0, 7)
                  )[0]

                  data_start = 8 + header_size + offsets[0]
                  data_end = 8 + header_size + offsets[1] - 1

                  actual = fetch_range(url, data_start, data_end)
                  expected = candidate(name, shape, kind)

                  matched = actual == expected

                  results.append((name, matched, len(actual)))

                  status = "EXACT MATCH" if matched else "NO MATCH"
                  print(
                      f"[{number}/{len(selected)}] {status}: "
                      f"{name} ({len(actual):,} bytes)",
                      flush=True
                  )

              except Exception as exc:
                  print(f"[ERROR] {name}: {exc}", flush=True)
                  results.append((name, None, 0))

          matches = sum(x[1] is True for x in results)
          mismatches = sum(x[1] is False for x in results)
          errors = sum(x[1] is None for x in results)

          print("\n" + "=" * 70)
          print("FINAL FORENSIC REPORT")
          print("=" * 70)
          print("Tested:", len(results))
          print("Exact matches:", matches)
          print("Mismatches:", mismatches)
          print("Errors:", errors)

          if results:
              print(
                  "Match percentage:",
                  f"{matches / len(results) * 100:.2f}%"
              )

          if matches == len(results) and results:
              print("VERDICT: ALL TESTED TENSORS MATCH")
          elif matches > 0:
              print("VERDICT: PARTIAL SEEDED-RNG EVIDENCE")
          else:
              print("VERDICT: RECIPE NOT CONFIRMED")

          print("\nThis scan does not authenticate every model tensor.")
          PY

          cat numbat-forensics.log

      - name: Upload forensic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numbat-full-forensic-report
          path: numbat-forensics.log
          retention-days: 7
