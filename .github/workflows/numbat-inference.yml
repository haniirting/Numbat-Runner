name: Numbat Inference - Stage 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selective-download:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download one tensor using HTTP Range
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import struct
          import hashlib

          REPO = "burner22/numbat"
          TARGET = "model.layers.10.mlp.experts.100.gate_proj.weight"

          BASE = f"https://huggingface.co/{REPO}/resolve/main"
          API = f"https://huggingface.co/api/models/{REPO}"
          MAX_BYTES = 64 * 1024 * 1024

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Numbat-Runner/2.1"}
              )
              with urllib.request.urlopen(req, timeout=120) as response:
                  return response.read()

          def request_range(url, start, end):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Range": f"bytes={start}-{end}",
                      "User-Agent": "Numbat-Runner/2.1"
                  }
              )

              with urllib.request.urlopen(req, timeout=120) as response:
                  if response.status != 206:
                      raise RuntimeError(
                          f"Expected HTTP 206, got {response.status}"
                      )

                  content_range = response.headers.get(
                      "Content-Range", ""
                  )

                  if not content_range.startswith(
                      f"bytes {start}-{end}/"
                  ):
                      raise RuntimeError(
                          f"Unexpected Content-Range: {content_range}"
                      )

                  data = response.read()

              if len(data) != end - start + 1:
                  raise RuntimeError("Incomplete range response")

              return data

          print("=" * 60)
          print("NUMBAT SELECTIVE TENSOR DOWNLOAD")
          print("=" * 60)

          print("\nSTEP 1: Download tensor index")

          index_url = f"{BASE}/model.safetensors.index.json"
          index = json.loads(get(index_url))

          weight_map = index["weight_map"]

          if TARGET not in weight_map:
              raise RuntimeError(f"Tensor not found: {TARGET}")

          shard = weight_map[TARGET]
          url = f"{BASE}/{shard}"

          print(f"Index loaded: {len(weight_map):,} tensors")
          print(f"Target: {TARGET}")
          print(f"Shard: {shard}")

          print("\nSTEP 2: Read Safetensors header")

          first_bytes = request_range(url, 0, 7)
          header_size = struct.unpack("<Q", first_bytes)[0]

          if header_size > 100 * 1024 * 1024:
              raise RuntimeError("Header is unexpectedly large")

          header_bytes = request_range(url, 8, 7 + header_size)
          header = json.loads(header_bytes)

          if TARGET not in header:
              raise RuntimeError("Tensor missing from shard header")

          metadata = header[TARGET]
          dtype = metadata["dtype"]
          shape = metadata["shape"]
          offsets = metadata["data_offsets"]

          data_start = 8 + header_size + offsets[0]
          data_end = 8 + header_size + offsets[1] - 1
          tensor_size = data_end - data_start + 1

          print(f"Header size: {header_size:,} bytes")
          print(f"Dtype: {dtype}")
          print(f"Shape: {shape}")
          print(f"Tensor size: {tensor_size:,} bytes")

          if tensor_size <= 0 or tensor_size > MAX_BYTES:
              raise RuntimeError("Tensor exceeds safety limit")

          print("\nSTEP 3: Download only selected tensor")

          tensor_data = request_range(url, data_start, data_end)
          digest = hashlib.sha256(tensor_data).hexdigest()

          with open("/tmp/numbat_selected_tensor.bin", "wb") as f:
              f.write(tensor_data)

          print(f"Downloaded: {len(tensor_data):,} bytes")
          print(f"SHA256: {digest}")

          print("\nSTEP 4: Verify")

          assert len(tensor_data) == tensor_size

          print("HTTP Range: PASS")
          print("Tensor metadata: PASS")
          print("Tensor download: PASS")
          print("Size verification: PASS")
          print("\nSELECTIVE DOWNLOAD SUCCESSFUL")
          print("No complete shard was downloaded.")
          print("No inference was performed.")
          PY
