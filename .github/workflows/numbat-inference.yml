name: Numbat Inference - Stage 3 NVFP4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-nvfp4:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download NVFP4 components
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import struct
          import hashlib

          REPO = "burner22/numbat"
          TARGET = "model.layers.10.mlp.experts.100.gate_proj.weight"
          BASE = f"https://huggingface.co/{REPO}/resolve/main"
          MAX_TENSOR = 64 * 1024 * 1024

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Numbat-Runner/3.0"}
              )
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read()

          def get_range(url, start, end):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Range": f"bytes={start}-{end}",
                      "User-Agent": "Numbat-Runner/3.0"
                  }
              )

              with urllib.request.urlopen(req, timeout=120) as r:
                  if r.status != 206:
                      raise RuntimeError(
                          f"Expected HTTP 206, got {r.status}"
                      )

                  cr = r.headers.get("Content-Range", "")
                  if not cr.startswith(f"bytes {start}-{end}/"):
                      raise RuntimeError(f"Bad Content-Range: {cr}")

                  data = r.read()

              if len(data) != end - start + 1:
                  raise RuntimeError("Incomplete range response")

              return data

          print("=" * 60)
          print("NUMBAT NVFP4 COMPONENT INSPECTOR")
          print("=" * 60)

          print("\nSTEP 1: Load tensor index")

          index = json.loads(
              get(f"{BASE}/model.safetensors.index.json")
          )
          weight_map = index["weight_map"]

          prefix = TARGET.rsplit(".", 1)[0]
          names = [
              prefix + ".weight",
              prefix + ".weight_scale",
              prefix + ".weight_scale_2",
              prefix + ".input_scale"
          ]

          for name in names:
              if name not in weight_map:
                  raise RuntimeError(f"Missing component: {name}")

          print("All four components found in index.")

          total_downloaded = 0
          results = []

          print("\nSTEP 2: Download components selectively")

          for name in names:
              shard = weight_map[name]
              url = f"{BASE}/{shard}"

              print(f"\nCOMPONENT: {name}")
              print(f"SHARD: {shard}")

              first = get_range(url, 0, 7)
              header_size = struct.unpack("<Q", first)[0]

              if header_size > 100 * 1024 * 1024:
                  raise RuntimeError("Header too large")

              header_bytes = get_range(
                  url, 8, 7 + header_size
              )
              header = json.loads(header_bytes)

              if name not in header:
                  raise RuntimeError(
                      f"Component missing from shard header: {name}"
                  )

              meta = header[name]
              start_offset, end_offset = meta["data_offsets"]

              data_start = 8 + header_size + start_offset
              data_end = 8 + header_size + end_offset - 1
              size = data_end - data_start + 1

              if size <= 0 or size > MAX_TENSOR:
                  raise RuntimeError(
                      f"Unsafe tensor size: {size}"
                  )

              data = get_range(url, data_start, data_end)
              digest = hashlib.sha256(data).hexdigest()

              if len(data) != size:
                  raise RuntimeError("Size mismatch")

              total_downloaded += len(data)

              results.append({
                  "name": name,
                  "dtype": meta["dtype"],
                  "shape": meta["shape"],
                  "bytes": len(data),
                  "sha256": digest
              })

              print(f" Dtype: {meta['dtype']}")
              print(f" Shape: {meta['shape']}")
              print(f" Bytes: {len(data):,}")
              print(f" SHA256: {digest}")

              del data

          print("\nSTEP 3: Summary")
          print(f"Components downloaded: {len(results)}")
          print(f"Total bytes: {total_downloaded:,}")
          print(f"Total MiB: {total_downloaded / 1024**2:.2f}")

          print("\nCOMPONENT SUMMARY")
          for item in results:
              print(
                  f"{item['name'].rsplit('.', 1)[-1]}: "
                  f"{item['dtype']} {item['shape']}"
              )

          print("\nNVFP4 COMPONENT DOWNLOAD SUCCESSFUL")
          print("Only selected tensor data was downloaded.")
          print("No complete shard was downloaded.")
          print("No inference was performed.")
          PY
