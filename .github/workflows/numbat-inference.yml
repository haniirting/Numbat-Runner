name: Numbat Runner - Real Inference

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Сообщение для Numbat"
        required: true
        type: string
        default: "Привет! Расскажи, кто ты и что умеешь."

permissions:
  contents: read

concurrency:
  group: numbat-inference
  cancel-in-progress: false

jobs:
  numbat:
    name: Numbat Inference
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MODEL_ID: burner22/numbat
      HF_HOME: ${{ github.workspace }}/.numbat-hf-cache
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      USER_PROMPT: ${{ inputs.prompt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.34.0"

      - name: Download metadata and attempt real inference
        id: inference
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          import shutil
          import traceback
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download, InferenceClient

          MODEL = os.environ["MODEL_ID"]
          PROMPT = os.environ["USER_PROMPT"]
          CACHE = os.environ["HF_HOME"]

          print("=" * 65)
          print("NUMBAT RUNNER")
          print("Model:", MODEL)
          print("=" * 65)

          result = "NOT_STARTED"
          details = []

          def report(text):
              print(text, flush=True)
              details.append(text)

          try:
              disk = shutil.disk_usage(os.environ["RUNNER_TEMP"])

              memory = 0
              try:
                  with open("/proc/meminfo") as f:
                      for line in f:
                          if line.startswith("MemTotal:"):
                              memory = int(line.split()[1]) * 1024
                              break
              except Exception:
                  pass

              report(f"Available disk: {disk.free / 1024**3:.2f} GB")
              report(f"Total RAM: {memory / 1024**3:.2f} GB")

              report("Connecting to Hugging Face...")
              api = HfApi(token=os.getenv("HF_TOKEN") or None)
              info = api.model_info(MODEL, files_metadata=True)

              report("Hugging Face repository found.")
              report(f"Revision: {info.sha}")

              report("Downloading original model metadata...")

              config_path = hf_hub_download(
                  repo_id=MODEL,
                  filename="config.json",
                  cache_dir=CACHE
              )

              index_path = hf_hub_download(
                  repo_id=MODEL,
                  filename="model.safetensors.index.json",
                  cache_dir=CACHE
              )

              tokenizer_path = hf_hub_download(
                  repo_id=MODEL,
                  filename="tokenizer.json",
                  cache_dir=CACHE
              )

              with open(config_path, encoding="utf-8") as f:
                  config = json.load(f)

              with open(index_path, encoding="utf-8") as f:
                  index = json.load(f)

              required = index.get("metadata", {}).get("total_size", 0)

              report("Original configuration downloaded.")
              report("Original tokenizer downloaded.")
              report("Original tensor index downloaded.")
              report(f"Model architecture: {config.get('architectures')}")
              report(f"Model type: {config.get('model_type')}")
              report(f"Tensor mappings: {len(index.get('weight_map', {})):,}")
              report(f"Declared weight size: {required:,} bytes")
              report(f"Declared weight size: {required / 1024**4:.2f} TB")

              if required:
                  disk_ok = required < disk.free * 0.8
                  memory_ok = required < memory * 0.65

                  report(f"Full local download fits disk: {disk_ok}")
                  report(f"Full local load fits RAM: {memory_ok}")

              report("")
              report("ATTEMPTING REAL HUGGING FACE INFERENCE...")
              report("Sending user prompt to the original model endpoint.")

              client = InferenceClient(
                  model=MODEL,
                  provider="auto",
                  token=os.getenv("HF_TOKEN") or None,
                  timeout=90
              )

              response = client.chat_completion(
                  messages=[
                      {
                          "role": "user",
                          "content": PROMPT
                      }
                  ],
                  max_tokens=100,
                  temperature=0.2
              )

              answer = response.choices[0].message.content

              if not answer:
                  raise RuntimeError("Model returned an empty answer.")

              result = "SUCCESS"
              report("")
              report("=" * 65)
              report("NUMBAT ANSWER")
              report("=" * 65)
              report(answer)
              report("=" * 65)

          except Exception as e:
              result = "FAILED"
              report("")
              report("=" * 65)
              report("INFERENCE FAILED")
              report(f"{type(e).__name__}: {e}")
              report("=" * 65)
              traceback.print_exc()

          finally:
              summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
              with summary.open("a", encoding="utf-8") as f:
                  f.write("# Numbat Runner result\n\n")
                  f.write(f"**Status:** `{result}`\n\n")
                  f.write(f"**Model:** `{MODEL}`\n\n")
                  f.write("## Execution log\n\n")
                  f.write("```text\n")
                  f.write("\n".join(details))
                  f.write("\n```\n")

          if result != "SUCCESS":
              sys.exit(1)
          PY

      - name: Cleanup downloaded files and cache
        if: always()
        run: |
          echo "Starting cleanup..."
          rm -rf "$HF_HOME"
          rm -rf "${{ runner.temp }}/numbat-*"
          echo "Temporary model files removed."
          echo "GitHub Actions logs and run summary are preserved."

      - name: Final status
        if: always()
        run: |
          echo "Numbat Runner execution finished."
          echo "Check the job logs and Summary tab."
