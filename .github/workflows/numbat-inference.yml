name: Numbat Runner - Real Inference

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Сообщение для Numbat"
        required: true
        type: string
        default: "Привет! Расскажи, кто ты и что умеешь."

permissions:
  contents: read

concurrency:
  group: numbat-inference
  cancel-in-progress: false

jobs:
  numbat:
    name: Numbat Inference
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      MODEL_ID: burner22/numbat
      HF_HOME: ${{ github.workspace }}/.numbat-hf-cache
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      USER_PROMPT: ${{ inputs.prompt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "huggingface_hub>=0.34.0"

      - name: Run real Numbat text generation
        id: inference
        run: |
          python - <<'PY'
          import os
          import sys
          import json
          import shutil
          import traceback
          from pathlib import Path
          from huggingface_hub import HfApi, hf_hub_download, InferenceClient

          MODEL = os.environ["MODEL_ID"]
          PROMPT = os.environ["USER_PROMPT"]
          CACHE = os.environ["HF_HOME"]
          TOKEN = os.getenv("HF_TOKEN") or None

          result = "NOT_STARTED"
          details = []

          def report(message):
              print(message, flush=True)
              details.append(message)

          try:
              disk = shutil.disk_usage(os.environ["RUNNER_TEMP"])

              memory = 0
              with open("/proc/meminfo") as f:
                  for line in f:
                      if line.startswith("MemTotal:"):
                          memory = int(line.split()[1]) * 1024
                          break

              report("=" * 65)
              report("NUMBAT RUNNER")
              report(f"Model: {MODEL}")
              report(f"Available disk: {disk.free / 1024**3:.2f} GB")
              report(f"Total RAM: {memory / 1024**3:.2f} GB")
              report(f"HF token configured: {bool(TOKEN)}")
              report("=" * 65)

              if not TOKEN:
                  raise RuntimeError("HF_TOKEN is missing.")

              report("Connecting to Hugging Face...")

              api = HfApi(token=TOKEN)
              info = api.model_info(MODEL, files_metadata=True)

              report("Repository found.")
              report(f"Revision: {info.sha}")

              config_path = hf_hub_download(
                  repo_id=MODEL,
                  filename="config.json",
                  cache_dir=CACHE,
                  token=TOKEN
              )

              index_path = hf_hub_download(
                  repo_id=MODEL,
                  filename="model.safetensors.index.json",
                  cache_dir=CACHE,
                  token=TOKEN
              )

              tokenizer_path = hf_hub_download(
                  repo_id=MODEL,
                  filename="tokenizer.json",
                  cache_dir=CACHE,
                  token=TOKEN
              )

              with open(config_path, encoding="utf-8") as f:
                  config = json.load(f)

              with open(index_path, encoding="utf-8") as f:
                  index = json.load(f)

              required = index.get("metadata", {}).get("total_size", 0)

              report(f"Architecture: {config.get('architectures')}")
              report(f"Model type: {config.get('model_type')}")
              report(f"Tensor mappings: {len(index.get('weight_map', {})):,}")
              report(f"Weight size: {required / 1024**4:.2f} TB")
              report("Metadata downloaded successfully.")

              report("")
              report("ATTEMPTING REAL TEXT GENERATION...")
              report("Using text_generation instead of chat_completion.")

              client = InferenceClient(
                  model=MODEL,
                  provider="auto",
                  token=TOKEN,
                  timeout=180
              )

              answer = client.text_generation(
                  PROMPT,
                  max_new_tokens=100,
                  temperature=0.2,
                  return_full_text=False
              )

              if not answer or not answer.strip():
                  raise RuntimeError("Model returned an empty answer.")

              result = "SUCCESS"

              report("")
              report("=" * 65)
              report("NUMBAT ANSWER")
              report("=" * 65)
              report(answer.strip())
              report("=" * 65)

          except Exception as error:
              result = "FAILED"
              report("")
              report("=" * 65)
              report("INFERENCE FAILED")
              report(f"{type(error).__name__}: {error}")
              report("=" * 65)
              traceback.print_exc()

          finally:
              summary = Path(os.environ["GITHUB_STEP_SUMMARY"])

              with summary.open("a", encoding="utf-8") as f:
                  f.write("# Numbat Runner result\n\n")
                  f.write(f"**Status:** `{result}`\n\n")
                  f.write(f"**Model:** `{MODEL}`\n\n")
                  f.write("## Execution log\n\n")
                  f.write("```text\n")
                  f.write("\n".join(details))
                  f.write("\n```\n")

          if result != "SUCCESS":
              sys.exit(1)
          PY

      - name: Cleanup downloaded files and cache
        if: always()
        run: |
          echo "Starting cleanup..."
          rm -rf "$HF_HOME"
          rm -rf "${{ runner.temp }}/numbat-*"
          echo "Temporary files removed."

      - name: Final status
        if: always()
        run: |
          echo "Numbat Runner execution finished."
          echo "Check the Summary tab."
