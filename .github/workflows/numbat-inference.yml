name: Numbat End-to-End Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML runtime
        continue-on-error: true
        run: |
          python -m pip install --no-cache-dir \
            torch transformers accelerate safetensors \
            huggingface_hub psutil

      - name: Run complete diagnostic
        id: diagnostic
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e

          python - <<'PY' > numbat-diagnostic.log 2>&1
          import os
          import sys
          import json
          import time
          import shutil
          import traceback
          import urllib.request

          REPO = "burner22/numbat"
          BASE = f"https://huggingface.co/{REPO}"

          failed = False
          model_size = None
          config = None
          model = None
          tokenizer = None

          def section(name):
              print("\n" + "=" * 65)
              print(name)
              print("=" * 65, flush=True)

          def error(name):
              global failed
              failed = True
              print(f"\n[ERROR] {name}")
              traceback.print_exc()

          print("NUMBAT END-TO-END DIAGNOSTIC")
          print("Started:", time.strftime("%Y-%m-%d %H:%M:%S UTC", time.gmtime()))
          print("Repository:", REPO)

          # 1. SYSTEM RESOURCES

          section("1. RUNNER HARDWARE")

          try:
              import psutil

              memory = psutil.virtual_memory()
              disk = shutil.disk_usage("/")

              print("CPU cores:", os.cpu_count())
              print(f"RAM total: {memory.total / 1024**3:.2f} GB")
              print(f"RAM available: {memory.available / 1024**3:.2f} GB")
              print(f"Disk total: {disk.total / 1024**3:.2f} GB")
              print(f"Disk free: {disk.free / 1024**3:.2f} GB")

              import torch

              print("PyTorch:", torch.__version__)
              print("CUDA available:", torch.cuda.is_available())

              if torch.cuda.is_available():
                  print("GPU:", torch.cuda.get_device_name(0))
                  print(
                      "GPU memory:",
                      torch.cuda.get_device_properties(0).total_memory
                      / 1024**3,
                      "GB"
                  )
              else:
                  print("GPU: NOT AVAILABLE")

          except Exception:
              error("Hardware inspection failed")

          # 2. MODEL METADATA

          section("2. MODEL METADATA")

          try:
              request = urllib.request.Request(
                  f"https://huggingface.co/api/models/{REPO}?blobs=true",
                  headers={"User-Agent": "Numbat-Diagnostic/1.0"}
              )

              with urllib.request.urlopen(request, timeout=120) as response:
                  model_info = json.loads(response.read())

              files = model_info.get("siblings", [])
              total = 0
              known = 0

              for item in files:
                  name = item.get("rfilename", "")
                  if name.endswith(".safetensors"):
                      size = item.get("size")
                      if size is None:
                          size = (item.get("lfs") or {}).get("size")
                      if size is not None:
                          total += int(size)
                          known += 1

              model_size = total

              print("Repository files:", len(files))
              print("Weight shards:", known)
              print(f"Total weight size: {total:,} bytes")
              print(f"Total weight size: {total / 1e12:.3f} TB")

          except Exception:
              error("Could not retrieve model metadata")

          # 3. DOWNLOAD ONLY CONFIGURATION AND MODEL CODE

          section("3. MODEL CONFIGURATION")

          local_path = None

          try:
              from huggingface_hub import snapshot_download

              local_path = snapshot_download(
                  repo_id=REPO,
                  allow_patterns=[
                      "config.json",
                      "*.py",
                      "tokenizer*",
                      "special_tokens_map.json",
                      "generation_config.json",
                      "vocab.json",
                      "merges.txt",
                      "*.model",
                      "added_tokens.json"
                  ]
              )

              print("Configuration downloaded:", local_path)
              print("Full model weights were NOT downloaded.")

          except Exception:
              error("Configuration or model-code download failed")

          # 4. LOAD CONFIGURATION AND TOKENIZER

          section("4. TRANSFORMERS INITIALIZATION")

          if local_path:
              try:
                  from transformers import AutoConfig

                  print("Loading custom Numbat configuration...")
                  config = AutoConfig.from_pretrained(
                      local_path,
                      trust_remote_code=True
                  )

                  print("Configuration loaded.")
                  print("Model class:", type(config).__name__)
                  print("Model type:", getattr(config, "model_type", None))
                  print("Architectures:", getattr(config, "architectures", None))
                  print("Layers:", getattr(config, "num_hidden_layers", None))
                  print("Hidden size:", getattr(config, "hidden_size", None))

              except Exception:
                  error("AutoConfig initialization failed")

              try:
                  from transformers import AutoTokenizer

                  print("\nLoading tokenizer...")
                  tokenizer = AutoTokenizer.from_pretrained(
                      local_path,
                      trust_remote_code=True
                  )

                  print("Tokenizer loaded.")
                  print("Tokenizer class:", type(tokenizer).__name__)

              except Exception:
                  print("TOKENIZER INITIALIZATION FAILED")
                  traceback.print_exc()

          # 5. EMPTY MODEL INITIALIZATION

          section("5. EMPTY ARCHITECTURE INITIALIZATION")

          architecture_ok = False

          if config is not None:
              try:
                  from accelerate import init_empty_weights
                  from transformers import AutoModelForCausalLM

                  print("Creating model on meta device.")
                  print("No pretrained weights will be loaded.")

                  with init_empty_weights(include_buffers=True):
                      model = AutoModelForCausalLM.from_config(
                          config,
                          trust_remote_code=True
                      )

                  params = sum(
                      p.numel() for p in model.parameters()
                  )

                  print("Architecture initialized successfully.")
                  print("Model class:", type(model).__name__)
                  print(f"Parameter count: {params:,}")
                  architecture_ok = True

                  del model
                  model = None

              except Exception:
                  error("Empty architecture initialization failed")

          else:
              print("SKIPPED: configuration unavailable")

          # 6. REAL RESOURCE CHECK

          section("6. FULL MODEL RESOURCE CHECK")

          if model_size is not None:
              try:
                  import psutil

                  disk_free = shutil.disk_usage("/").free
                  ram_available = psutil.virtual_memory().available

                  print(f"Model weights: {model_size / 1e12:.3f} TB")
                  print(f"Available disk: {disk_free / 1e12:.3f} TB")
                  print(f"Available RAM: {ram_available / 1e12:.3f} TB")

                  required = int(model_size * 1.20)

                  print(f"Estimated safe storage requirement: {required:,} bytes")

                  enough_disk = disk_free >= required
                  enough_ram = ram_available >= required

                  print("Disk requirement met:", enough_disk)
                  print("RAM requirement met:", enough_ram)

                  if not (enough_disk and enough_ram):
                      print("\nFULL MODEL LOAD BLOCKED")
                      print("Reason: insufficient runner resources.")
                      print("No complete weight download was attempted.")

                  else:
                      section("7. ACTUAL MODEL LOAD AND GENERATION")

                      from transformers import AutoModelForCausalLM

                      loaded = AutoModelForCausalLM.from_pretrained(
                          REPO,
                          trust_remote_code=True,
                          device_map="auto",
                          torch_dtype="auto",
                          low_cpu_mem_usage=True
                      )

                      print("MODEL WEIGHTS LOADED.")

                      if tokenizer is None:
                          raise RuntimeError("Tokenizer unavailable")

                      import torch

                      inputs = tokenizer(
                          "Hello! Introduce yourself briefly.",
                          return_tensors="pt"
                      )

                      device = next(loaded.parameters()).device
                      inputs = {
                          key: value.to(device)
                          for key, value in inputs.items()
                      }

                      print("Starting text generation...")

                      with torch.inference_mode():
                          output = loaded.generate(
                              **inputs,
                              max_new_tokens=8,
                              do_sample=False
                          )

                      print("GENERATED TEXT:")
                      print(tokenizer.decode(
                          output[0],
                          skip_special_tokens=True
                      ))

                      print("\nINFERENCE SUCCESSFUL")

              except Exception:
                  error("Resource check or actual model execution failed")

          else:
              print("Cannot calculate resource requirements.")

          # 7. FINAL RESULT

          section("FINAL DIAGNOSTIC RESULT")

          if failed:
              print("RESULT: ERRORS DETECTED")
          elif model_size is not None:
              print("RESULT: DIAGNOSTIC COMPLETED")
          else:
              print("RESULT: INCOMPLETE")

          print("Architecture initialized:", architecture_ok)
          print("Model size known:", model_size is not None)
          print("Full inference is NOT claimed unless generation succeeded.")
          print("\nEND OF DIAGNOSTIC")

          PY

          STATUS=$?
          cat numbat-diagnostic.log
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Upload complete diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numbat-complete-diagnostic
          path: numbat-diagnostic.log
          if-no-files-found: warn
          retention-days: 7

      - name: Add result to summary
        if: always()
        run: |
          if [ -f numbat-diagnostic.log ]; then
            echo "## Numbat diagnostic" >> "$GITHUB_STEP_SUMMARY"
            tail -n 60 numbat-diagnostic.log >> "$GITHUB_STEP_SUMMARY"
          fi
